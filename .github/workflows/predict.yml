name: Update WC26 predictions

# Runs the prediction pipeline on a schedule, commits the updated
# predictions.json, and pushes to main. Vercel then auto-deploys.
#
# Why GitHub Actions instead of Vercel Cron Jobs?
# - Pipeline runtime ~90s (Dixon-Coles MLE fit + 20k Monte Carlo sims).
#   Vercel Hobby has a 60s function timeout that would cause failures;
#   Pro tier (300s) would work but isn't required for this project.
# - Pipeline needs system libomp for XGBoost — trivial in apt, awkward
#   in Vercel's Python runtime.
# - We want to persist the JSON without standing up Vercel Blob — pushing
#   to the repo is simpler and triggers an automatic Vercel deploy.
# Migrate to Vercel Cron + Blob if the pipeline shrinks below 60s and
# committing to the repo gets noisy.
#
# Setup (one-time):
#   1. Push this repo to GitHub (any visibility)
#   2. Vercel dashboard → Project → Settings → Git → connect this GH repo
#   3. Repo Settings → Secrets and variables → Actions →
#      add secret FOOTBALL_DATA_API_KEY with your football-data.org key
#   4. Repo Settings → Actions → General → Workflow permissions →
#      "Read and write permissions" (so the action can push commits)

on:
  schedule:
    # Daily baseline at 12:00 UTC (refreshes the DC fit with new historical
    # data even on days without matches). During match windows, the
    # watch-results.yml workflow polls every 15 min and triggers this
    # pipeline via workflow_dispatch the moment a match finishes — so no
    # blind high-frequency cron is needed here.
    - cron: '0 12 * * *'
  workflow_dispatch:  # manual trigger from the Actions tab
    inputs:
      force_deploy:
        description: 'Deploy to Vercel even if predictions did not change (useful for testing or re-publishing the same data)'
        type: boolean
        default: false

# Avoid concurrent runs racing on the same commit
concurrency:
  group: predict
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # actions/checkout@v5 and setup-python@v6 run on Node.js 24, dodging
      # the deprecation of Node.js 20 on GitHub runners on 2026-06-02.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'model/requirements.txt'

      - name: Install system libomp (XGBoost runtime, even if unused)
        run: sudo apt-get install -y libomp-dev

      - name: Install Python dependencies
        working-directory: model
        run: |
          pip install --upgrade pip
          # Deps are exact-pinned in requirements.txt — no surprise upgrades.
          pip install -r requirements.txt
          pip install -e .

      # Sanity test before we trust the pipeline output enough to deploy it.
      # 136 tests covering Elo, Dixon-Coles, simulator, priors, bracket seeding,
      # injuries, aggregator, API-Football parser, chemistry, venues.
      - name: Run tests
        working-directory: model
        run: pytest -q

      # Refresh injuries from external sources (Phase 1: API-Football).
      # Gracefully no-ops if API_FOOTBALL_KEY is missing — the pipeline then
      # uses whatever injuries.json was last committed.
      - name: Refresh injuries
        working-directory: model
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python scripts/05_refresh_injuries.py

      - name: Run prediction pipeline
        working-directory: model
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: python scripts/03_run_simulation.py

      - name: Commit updated predictions if changed
        id: commit
        run: |
          # Author commits as the repo owner so they link to the GitHub profile
          git config user.name  "brto"
          git config user.email "beto.ceballos@gmail.com"
          # Also commit injuries.json refresh (the refresh step may have
          # rewritten it), the pre-match snapshot store, and the
          # probability-history log (both accumulate state across runs).
          git add web/lib/data/predictions.json model/data/static/injuries.json \
                  model/data/state/prematch_snapshots.json \
                  model/data/state/probability_history.jsonl

          if git diff --staged --quiet -- web/lib/data/predictions.json; then
            echo "No prediction changes — skipping commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Check whether anything other than generated_at moved
          diff_lines=$(git diff --staged -- web/lib/data/predictions.json | \
            grep -E '^[+-]' | \
            grep -vE '^(---|\+\+\+|[+-]\s*"generated_at")' | \
            wc -l)

          if [ "$diff_lines" -eq 0 ]; then
            echo "Only generated_at changed — skipping commit."
            git reset HEAD -- web/lib/data/predictions.json
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "Update predictions $(date -u +%Y-%m-%d) [skip ci]"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Deploy via Vercel CLI directly — bypasses Vercel's GitHub auto-deploy
      # (which fails because the project's Root Directory is the repo root
      # but the Next.js app lives in web/).
      - name: Deploy to Vercel
        if: (steps.commit.outputs.changed == 'true' || inputs.force_deploy == true) && env.VERCEL_TOKEN != ''
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        working-directory: web
        run: |
          # pnpm needed because vercel build reads pnpm-lock.yaml and shells
          # out to `pnpm install` — ENOENT otherwise on a fresh GH runner.
          # Lockfile is v9.0 (pnpm 9/10); Vercel picks pnpm@10 by default for
          # this project, so we match that to avoid lockfile-mismatch errors.
          npm install -g vercel@latest pnpm@10
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
